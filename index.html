<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f9fb;            /* neutral-98 / cv-light-surface */
      --card: #ffffff;
      --text: #00233c;          /* navy-13 */
      --muted: #59627b;         /* neutral-30 */
      --outline: #d1d5e7;       /* neutral-80 */
      --primary: #3053f4;       /* digital-blue-40 */
      --primary-hover: #2044e3; /* digital-blue-35 */
      --orange: #ff5f02;        /* orange-40 / Teradata orange */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 64px 32px;
      background: var(--bg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    h1 { font-size: 2.25rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 16px; }
    .lead { font-size: 1.05rem; line-height: 1.6; color: var(--muted); margin-bottom: 32px; }

    /* Action bar: the VPN requirement sits on the same card as the action it gates */
    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 14px 14px 14px 18px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--outline);
      box-shadow: 0 1px 2px rgba(0, 35, 60, 0.05);
    }

    .req { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; line-height: 1.4; }
    .req b { display: block; font-weight: 600; }
    .req .sub { display: block; font-size: 0.8rem; color: var(--muted); }
    .req .icon { display: flex; flex-shrink: 0; color: var(--orange); }

    .button {
      display: inline-flex; align-items: center; gap: 8px;
      flex-shrink: 0;
      padding: 12px 24px;
      border-radius: 6px;
      background: var(--primary);
      color: #ffffff;
      font-size: 0.95rem; font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }

    .button:hover { background: var(--primary-hover); }
    .button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

    @media (max-width: 760px) {
      body { padding: 40px 16px; }
      h1 { font-size: 1.75rem; }
    }

    @media (max-width: 560px) {
      .bar { flex-direction: column; align-items: stretch; }
      .button { justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Spark design system</h1>
    <p class="lead">Guidelines, foundations, and components for building Teradata products.</p>

    <div class="bar">
      <div class="req">
        <!-- Lucide "lock" icon, lucide-static v1.56.0, ISC licence -->
        <span class="icon"><svg class="lucide lucide-lock" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg></span>
        <div><b>Teradata VPN required</b><span class="sub">Connect before opening the docs</span></div>
      </div>
      <a class="button" href="http://pe09-ubuntu-0106.labs.teradata.com/?path=/docs/foundations-color--documentation">
        Open documentation
        <!-- Lucide "arrow-right" icon, lucide-static v1.56.0, ISC licence -->
        <svg class="lucide lucide-arrow-right" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
      </a>
    </div>
  </main>
</body>
</html>
